<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة إسلاميات</title>
<style>
body{background:#101c17;color:#f9efd5;font:16px system-ui;margin:0}main{max-width:850px;margin:30px auto;padding:20px}section,form{background:#192a21;border:1px solid #a98e55;border-radius:14px;padding:18px;margin:12px 0}label,input,select,button{display:block;margin:8px 0;font:inherit}input,select,button{padding:9px;border-radius:7px}input,select{max-width:95%;background:#fffaf0;color:#17251f}button{background:#edcf8e;color:#17251f;cursor:pointer;border:0}li{padding:8px 0;overflow-wrap:anywhere}code{direction:ltr;unicode-bidi:isolate}#status{min-height:1.5em}
</style>
<main>
<h1>إدارة إسلاميات</h1>
<form id="login">
<label>البريد الإداري <input id="email" type="email" autocomplete="username" required></label>
<label>كلمة المرور <input id="password" type="password" autocomplete="current-password" required></label>
<button>دخول الإدارة</button>
</form>
<p id="status" role="status"></p>
<div id="dashboard" hidden>
<button type="button" id="logout">تسجيل الخروج</button>
<form id="create">
<h2>إنشاء كود</h2>
<p>تبدأ هدية برايم المؤقتة عند تفعيل الكود من حساب المستخدم. أكواد الخصم محفوظة للربط عند إضافة الدفع.</p>
<label>نوع العرض <select id="kind"><option value="days">استخدام مجاني مؤقت</option><option value="lifetime">استخدام مجاني دائم</option><option value="discount">خصم</option></select></label>
<label id="amount-label"><span id="amount-title">عدد الأيام</span><input id="amount" type="number" min="1" max="3650" value="30" required></label>
<label>الحد الأقصى للاستخدام <input id="limit" type="number" min="1" max="10000" value="1" required></label>
<button>إنشاء كود</button>
</form>
<section><h2>الأكواد</h2><ul id="offers"></ul></section>
</div>
</main>
<script>
'use strict';
const base='https://fcvpmvjtzbwgvylblogp.supabase.co';
const key='sb_publishable_gzsiB3N884mDKsgn1xDc9Q_h_0Gj7m-';
const field=id=>document.getElementById(id);
let token=null;
const status=message=>field('status').textContent=message;
async function request(path,method='GET',body){
 const headers={apikey:key,'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 const response=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
 if(!response.ok)throw Error('Request failed');
 return response.status===204?null:response.json();
}
function logout(){
 token=null;
 field('dashboard').hidden=true;
 field('login').hidden=false;
 field('offers').replaceChildren();
 status('');
}
field('logout').onclick=logout;
field('login').onsubmit=async event=>{
 event.preventDefault();
 const submit=event.currentTarget.querySelector('button');
 submit.disabled=true;
 try{
  const session=await request('/auth/v1/token?grant_type=password','POST',{email:field('email').value,password:field('password').value});
  token=session.access_token;
  if(await request('/rest/v1/rpc/islamiyat_is_admin','POST',{})!==true)throw Error('Forbidden');
  await refresh();
  field('login').hidden=true;
  field('dashboard').hidden=false;
  status('');
 }catch{logout();status('تعذّر الدخول. تحقّق من الحساب وصلاحية الإدارة.')}
 finally{field('password').value='';submit.disabled=false}
};
const labels={days:'مجاني مؤقت',lifetime:'مجاني دائم',discount:'خصم'};
async function refresh(){
 const rows=await request('/rest/v1/islamiyat_offers?order=created_at.desc');
 const list=field('offers');
 list.replaceChildren();
 for(const row of rows){
  const entry=document.createElement('li');
  const code=document.createElement('code');code.textContent=row.code;
  const details=row.kind==='days'?' · '+row.amount+' يوم':row.kind==='discount'?' · '+row.amount+'٪':'';
  entry.append(code,document.createTextNode(' · '+labels[row.kind]+details+' · '+row.uses+'/'+row.max_uses));
  const toggle=document.createElement('button');
  toggle.type='button';toggle.textContent=row.enabled?'تعطيل':'إعادة تفعيل';
  toggle.onclick=async()=>{
   toggle.disabled=true;
   try{await request('/rest/v1/islamiyat_offers?id=eq.'+row.id,'PATCH',{enabled:!row.enabled});await refresh();status('تم تحديث الكود.')}
   catch{status('تعذّر تحديث الكود.');toggle.disabled=false}
  };
  const copy=document.createElement('button');
  copy.type='button';
  copy.textContent='نسخ الكود';
  copy.onclick=async()=>{
   try{await navigator.clipboard.writeText(row.code);status('تم نسخ الكود.')}
   catch{status('انسخ الكود الظاهر في القائمة.')}
  };
  entry.append(copy,toggle);list.append(entry);
 }
}
field('kind').onchange=()=>{
 const kind=field('kind').value;
 field('amount-label').hidden=kind==='lifetime';
 field('amount').disabled=kind==='lifetime';
 field('amount').max=kind==='discount'?100:3650;
 field('amount-title').textContent=kind==='discount'?'نسبة الخصم':'عدد الأيام';
};
field('create').onsubmit=async event=>{
 event.preventDefault();
 const submit=event.currentTarget.querySelector('button');submit.disabled=true;
 try{
  const code=Array.from(crypto.getRandomValues(new Uint8Array(16)),value=>value.toString(16).padStart(2,'0')).join('').toUpperCase();
  const kind=field('kind').value;
  await request('/rest/v1/islamiyat_offers','POST',{code,kind,amount:kind==='lifetime'?null:Number(field('amount').value),max_uses:Number(field('limit').value)});
  await refresh();status('تم إنشاء الكود.');
 }catch{status('تعذّر إنشاء الكود أو تحديث القائمة.')}
 finally{submit.disabled=false}
};
</script>
</html>
